<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Frete</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Calculadora de Frete</h1>

        <p>
            Informe o CEP do destino para calcular a distância
            e o valor estimado do frete.
        </p>

        <div class="formulario">

            <label for="cep">CEP:</label>

            <input
                type="text"
                id="cep"
                placeholder="Ex: 60411-060"
                maxlength="9"
            >

            <button id="btnCalcular">
                Calcular Frete
            </button>

        </div>

        <div id="resultado" class="resultado">

            <h2>Resultado</h2>

            <p id="endereco"></p>

            <p id="distancia"></p>

            <p id="frete"></p>

        </div>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
